name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore from GitHub Secrets (optional)
        env:
          AEGIS_KEYSTORE_BASE64: ${{ secrets.AEGIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AEGIS_KEYSTORE_BASE64" ]; then
            echo "$AEGIS_KEYSTORE_BASE64" | base64 -d > aegis.keystore
            echo "release keystore ready"
          else
            echo "No release secrets — shipping debug-signed APK for sideload"
          fi

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Assemble debug (always installable)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release (only if secrets present)
        env:
          AEGIS_STORE_PASSWORD: ${{ secrets.AEGIS_STORE_PASSWORD }}
          AEGIS_KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          AEGIS_KEYSTORE_PATH: aegis.keystore
        run: |
          if [ -f aegis.keystore ] && [ -n "$AEGIS_STORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Skip release — use aegis-shield-apk-debug artifact"
          fi

      - name: Scrub keystore
        if: always()
        run: rm -f aegis.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-shield-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: aegis-shield-apk-release
          path: android/app/build/outputs/apk/release/*.apk
